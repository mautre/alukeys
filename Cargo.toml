[workspace]
resolver = "3"
members = ["crates/alukeys-core", "crates/alukeys-diag", "crates/alukeys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mautre/alukeys"

[workspace.dependencies]
windows-sys = "0.61"
serde = { version = "1", features = ["derive"] }
toml = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

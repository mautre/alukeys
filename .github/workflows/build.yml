name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup component add clippy rustfmt
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build x64
        run: cargo build --release -p alukeys -p alukeys-diag --target x86_64-pc-windows-msvc
      - name: Build arm64
        run: cargo build --release -p alukeys -p alukeys-diag --target aarch64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          foreach ($arch in @("x64", "arm64")) {
            $t = if ($arch -eq "x64") { "x86_64-pc-windows-msvc" } else { "aarch64-pc-windows-msvc" }
            $d = "dist/AluKeys-$arch"
            New-Item -ItemType Directory -Force $d | Out-Null
            Copy-Item "target/$t/release/alukeys.exe", "target/$t/release/alukeys-diag.exe", README.md, README.ru.md, LICENSE $d
            Compress-Archive -Path "$d/*" -DestinationPath "dist/AluKeys-$arch.zip" -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AluKeys
          path: dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
